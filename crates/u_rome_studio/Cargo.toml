[package]
name = "u_rome_studio"
description = "ROME Studio: asset viewer, world viewer and modding tools for your own GTA VI install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "u_rome_studio"
path = "src/main.rs"

[dependencies]
u_rome_core.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger = "0.11.12"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "glow", "persistence", "clipboard"] }
egui_dock = { version = "0.22.0", features = ["serde"] }
rfd = "0.18.0"
dirs = "7.0.0"
serde_json = "1.0.154"
egui_extras = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
ron = "0.12.3"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"
