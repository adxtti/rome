[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
u_rome_core = { path = "crates/u_rome_core" }
u_rome_rpf9 = { path = "crates/u_rome_rpf9" }
u_rome_index = { path = "crates/u_rome_index" }
u_rome_install = { path = "crates/u_rome_install" }
u_rome_pso = { path = "crates/u_rome_pso" }
u_rome_testdata = { path = "crates/u_rome_testdata" }

thiserror = "2"
anyhow = "1"
log = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
