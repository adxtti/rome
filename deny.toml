# cargo-deny configuration. Run `cargo deny check` (CI runs it on every push).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only resolve dependencies for platforms we build and ship, plus Linux for
# contributors and CI. Keeps platform-only crates for other OSes out of checks.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RustSec advisories: vulnerabilities, unsound and yanked crates fail the
# check; unmaintained notices for transitive crates only fail when reachable
# from our own crates.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. cargo-deny denies every license not listed here,
# so GPL, AGPL and LGPL (and other copyleft licenses) are rejected. A crate
# offered under "X OR GPL" is accepted through its permissive alternative.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = [
    # egui's bundled default fonts: Hack (MIT), Noto Emoji and emoji-icon-font
    # (OFL-1.1) and Ubuntu-Light (Ubuntu Font Licence). Both font licences are
    # permissive for embedding and redistribution in software.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Workspace crates are publish = false but still carry MIT OR Apache-2.0, so
# they are checked like everything else.
ignore = false
registries = []

[bans]
# Duplicate versions and wildcard requirements are reported, not fatal: the
# eframe/wgpu tree pulls several majors of the same crates.
multiple-versions = "warn"
wildcards = "warn"
# Workspace path dependencies are not wildcards for our purposes.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# bcpack-rs (BCPack texture decoding) is consumed from git.
github = ["Ahmet-Dedeler"]
gitlab = []
bitbucket = []
