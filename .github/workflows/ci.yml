name: ci

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p u_rome_studio -p u_rome_cli
      - name: Package
        shell: pwsh
        run: |
          $out = "u_rome-${{ matrix.arch }}"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/u_rome_studio.exe $out/
          Copy-Item target/${{ matrix.target }}/release/rome.exe $out/
          Copy-Item LICENSE-MIT, LICENSE-APACHE $out/
      - uses: actions/upload-artifact@v4
        with:
          name: u_rome-windows-${{ matrix.arch }}
          path: u_rome-${{ matrix.arch }}
