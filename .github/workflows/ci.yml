name: ci

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p u_rome_studio -p u_rome_cli
      - name: Package
        shell: pwsh
        run: |
          $out = "u_rome-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/u_rome_studio.exe $out/
          Copy-Item target/${{ matrix.target }}/release/rome.exe $out/
          Copy-Item LICENSE-MIT, LICENSE-APACHE $out/
      - uses: actions/upload-artifact@v7
        with:
          name: u_rome-windows-${{ matrix.arch }}
          path: u_rome-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
